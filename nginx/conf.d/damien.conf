# Bloc HTTPS principal pour damien.chaudois.com
# Sert les fichiers statiques depuis le volume monté frontend/dist/
server {
    listen 443 ssl;
    server_name damien.chaudois.com;

    # Certificats Let's Encrypt générés par Certbot
    # fullchain.pem inclut le certificat + la chaîne intermédiaire
    ssl_certificate     /etc/letsencrypt/live/damien.chaudois.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damien.chaudois.com/privkey.pem;

    # Protocoles modernes uniquement — TLS 1.0 et 1.1 sont obsolètes et vulnérables
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dossier racine mappé depuis le volume Docker ./frontend/dist
    root /var/www/portfolio;
    index index.html;

    location / {
        # try_files cherche le fichier demandé, puis un dossier, puis renvoie index.html
        # Le dernier fallback (=404) est atteint uniquement si index.html lui-même est absent
        try_files $uri $uri/ /index.html =404;
    }
}