<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Portfolio</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f7fa;
        color: #1f2937;
        line-height: 1.6;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1rem 2rem;
      }

      header {
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 2rem;
      }

      .site-header {
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
        font-weight: 600;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
      }

      ul {
        margin: 0;
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="site-header">Header bidon</div>
    </header>

    <div class="container">
      <main>
        <h1>Bienvenue sur la page d'accueil</h1>
        <section aria-labelledby="katas-title">
          <h2 id="katas-title">Liste des katas</h2>
          <ul id="kata-list"></ul>
        </section>
      </main>
    </div>
  </body>
</html>
