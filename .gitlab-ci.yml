# Pipeline GitLab CI — déploiement sur VPS Hetzner
#
# Stratégie : git pull + nginx reload.
# Le frontend est du HTML/CSS/JS statique servi directement par Nginx depuis
# le volume ./frontend/dist. Un git pull suffit à mettre à jour le site.
# nginx -s reload est nécessaire uniquement quand la config nginx change,
# mais on le lance systématiquement — c'est une opération à chaud sans downtime.

stages:
  - deploy

deploy:
  stage: deploy
  # Image légère pour le runner — on n'a besoin que de ssh
  image: alpine:latest

  before_script:
    # Installation du client SSH (absent par défaut sur alpine)
    - apk add --no-cache openssh-client

    # Ajout du VPS aux hôtes connus du runner pour éviter le prompt interactif
    # "Are you sure you want to continue connecting?" qui bloquerait le pipeline
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

    # $VPS_SSH_KEY est une variable GitLab de type "File" :
    # GitLab écrit la clé privée dans un fichier temporaire et expose son chemin.
    # sed -i 's/\r//' supprime les retours chariot Windows (\r, CRLF) éventuellement
    # introduits en copiant la clé depuis Windows — libcrypto rejette tout fichier qui en contient.
    # SSH exige des permissions 600 (lecture propriétaire uniquement) — sinon il refuse la clé.
    - sed -i 's/\r//' $VPS_SSH_KEY
    - chmod 600 $VPS_SSH_KEY

    # --- DIAGNOSTIC TEMPORAIRE — à supprimer une fois le problème résolu ---
    # Affiche la première ligne : doit être "-----BEGIN OPENSSH PRIVATE KEY-----"
    - head -1 $VPS_SSH_KEY
    # Compte le nombre de lignes : une clé valide en a typiquement une vingtaine
    - wc -l $VPS_SSH_KEY
    # Tente de lire la clé et d'en extraire la clé publique — échoue si passphrase ou format invalide
    - ssh-keygen -y -P "" -f $VPS_SSH_KEY || echo "ECHEC ssh-keygen — clé invalide ou protégée par passphrase"
    # --- FIN DIAGNOSTIC ---

  script:
    # Connexion SSH au VPS, deux commandes :
    # 1. git pull        — récupère les derniers fichiers (frontend/dist/, nginx/conf.d/, compose)
    #                      Nginx sert frontend/dist/ via un volume monté : les fichiers sont
    #                      immédiatement disponibles sans rebuild ni restart de container.
    # 2. nginx -s reload — recharge la config nginx à chaud, sans interruption de service
    #                      (-T dans exec = mode non-TTY, requis hors terminal interactif)
    - ssh -i $VPS_SSH_KEY $VPS_USER@$VPS_HOST
        "cd ~/portfolio
        && git pull
        && docker compose exec -T nginx nginx -s reload
        && echo 'Deploy OK'"

  # Ne déclenche le job que sur les pushs vers master.
  # Les merge requests et autres branches n'ont pas accès aux variables de déploiement.
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
